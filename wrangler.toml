# Cloudflare Workers + static assets — CI runs `npx wrangler deploy`.
name = "wardogshacks"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

# Custom domains (getwardogshacks.org) are NOT declared here — Wrangler fails
# deploy if the zone is missing from this Cloudflare account. After you add the
# domain in Cloudflare (DNS → proxied orange cloud), attach it in the dashboard:
# Workers & Pages → wardogshacks → Settings → Domains & Routes → Add domain.
# Then you can optionally restore:
#   [[routes]]
#   pattern = "getwardogshacks.org"
#   custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
